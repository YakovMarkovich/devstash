          - text: ", або курси з айті-технологій для тих, хто вже має базові навички та досвід."
        - listitem [level=1] [ref=e735]: Отримуєте доступ до записів відеоуроків, де детально розповідається тема. Також у вас є додаткові матеріали і всі необхідні ресурси, щоб з першого заняття почати освоювати обрану технологію.
        - listitem [level=1] [ref=e736]: Знайомитеся з ментором, який буде супроводжувати вас на навчанні. Він перевіряє результати вашої роботи, дає рекомендації і допомагає розібратися в темі.
        - listitem [level=1] [ref=e737]: Ви отримуєте доступ до спільноти, де можете додатково обговорювати процес навчання.
        - listitem [level=1] [ref=e738]:
          - link "Ментор" [ref=e739] [cursor=pointer]:
            - /url: https://foxminded.ua/mentoring-course/
          - text: відстежує ваші успіхи, дає рекомендації, спираючись на реальні вимоги роботодавців і клієнтів. Ви отримуєте не просто навички, а актуальний практичний досвід.
      - paragraph [ref=e740]: Неважливо, чи це буде курс python або курси html, на кожній освітній програмі є свій ментор рівня Middle або Senior.
      - heading "Особливості навчання в FoxmindEd" [level=2] [ref=e741]
      - paragraph [ref=e742]: Наша школа IT-професій готує фахівців з нуля, а також допомагає підвищити рівень кваліфікації. Після проходження навчання ви отримуєте електронний сертифікат, що підтверджує ваші навички.
      - paragraph [ref=e743]: Весь процес навчання побудований за принципом симуляції реальної роботи в IT-компанії. Кожне завдання перевіряється ментором і ви отримуєте фідбек з рекомендаціями.
      - paragraph [ref=e744]: "Особливості навчання в IT школі FoxmindEd наступні:"
      - list [ref=e745]:
        - listitem [level=1] [ref=e746]:
