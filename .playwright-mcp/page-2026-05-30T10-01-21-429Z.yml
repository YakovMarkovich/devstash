          - text: ", програми для різних операційних систем і так далі."
        - listitem [level=1] [ref=e748]: На кожному курсі свій ментор-практик, досвідчений фахівець, що працює в IT сфері.
        - listitem [level=1] [ref=e749]: У нас немає теоретичних лекцій. Тільки короткі вступні та практичні насичені відеоуроки. Під час проходження ви відразу берете і робите. Результат з першого заняття.
