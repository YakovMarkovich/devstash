            - paragraph [ref=e319]: Розробник з більш ніж 20-річним стажем. Маю досвід керівництва та менторства.
            - paragraph [ref=e320]: Починав і довгий час працював з 1С. Також мав досвід роботи з C++, Pascal, FoxPro, PHP, HTML, CSS, JavaScript.
            - paragraph [ref=e321]: З 2021 року працюю Android-розробником на фултайм в міжнародних компаніях. Загальний досвід в Android — близько 7 років.
