          - paragraph [ref=e341]:
            - text: "Android-розробник з більш ніж 5-річним досвідом. За цей час я працював у різних компаніях, кожна з яких мала свій підхід до розробки. Це дало мені цінний досвід роботи над застосунками різних сфер і розмірів. Маю досвід роботи на всіх етапах розробки: від аналізу та проектування до тестування та відлагодження. Також маю досвід співпраці з міжфункціональними командами для досягнення поставлених цілей. Прагну використовувати сучасні технології та підходи у своїй роботі. Водночас, я розумію важливість знання базових принципів та фундаментальних знань для успішного розвитку."
            - text: "Свій шлях я розпочав ще в університеті, де отримав фундаментальні знання з програмної інженерії. Опанував специфіку Android-розробки самостійно: мені допомогли інтернет-ресурси, книги, документація та, звісно ж, практика. Тому я знаю, як це зробити, і готовий поділитися своїм досвідом та знаннями з іншими."
