          - paragraph [ref=e301]: Ще будучи студентом почав вивчати Java, завдяки чому отримав свою першу серйозну роботу в енергетичній компанії, якій треба було мобільний додаток. Так я встав на доріжку Android розробки. Зараз я займаю позицію Android Tech Lead та піклуюся про впровадження архітектурних рішень до проектів та про розвиток моєї команди.. А в якості ментора, я хочу передати свій досвід і знання, і розвіяти оману, що «програмування — це магія», як це було у мене).
