  - generic [ref=e231]:
    - heading "Навчання IT з нуля у FoxmindEd" [level=2] [ref=e232]
    - generic [ref=e233]:
      - paragraph [ref=e234]: "Чи хочете ви зайти в сферу ІТ без багатомісячних «прелюдій», одразу писати код і збирати перші результати? У цьому вам допоможе FoxmindEd, адже тут ви працюєте за прозорою траєкторією Start — Mentoring — Project: спершу закриваєте базу на коротких стартових курсах, далі рухаєтесь у формат 1-на-1 з ментором, а потім показуєте «дорослий» результат у вигляді репозиторію, невеликого сервісу чи проєкту. Акцент у нас зосереджено на практиці, коротких ітераціях і підтримці, а не на довгих лекціях."
      - heading "Що ви опануєте на курсах" [level=2] [ref=e235]
      - paragraph [ref=e236]: "Ви починаєте зі Start-курсів: короткі відео, практичні завдання після кожного уроку, зручний темп і доступ онлайн. Формат спеціально зібраний для новачків, щоб ви не зациклюватися на теорії й одразу бачили робочий результат у коді. На сторінці стартових курсів це сформульовано прямо: жива практика і зрозумілий маршрут у менторинг."
      - paragraph [ref=e237]: "Після старту ви переходите в менторинг 1-на-1: отримуєте завдання, здаєте рішення, забираєте правки, рухаєтесь далі короткими кроками. У фокусі — конкретні навички розробника (Git, фреймворки, бази, тести, деплой), а не «красиві слайди»."
      - heading "Як побудована траєкторія навчання" [level=2] [ref=e238]
      - list [ref=e239]:
        - listitem [level=1] [ref=e240]: Start. Ви ставите середовище, вивчаєте синтаксис і відразу закріплюєте все практикою. Якщо код зібрався — ідете далі, якщо «спотикнулись» — звертаєтесь у спільноту (наприклад, через Zulip) і виправляєте.
        - listitem [level=1] [ref=e241]: "Mentoring. Ви працюєте з інженером-практиком 1-на-1: коротке пояснення — реалізація — code review — доробка. Така логіка у нас побудована для того, щоб учні отримували менше теорії і замість цього більше працювали з корисним кодом."
        - listitem [level=1] [ref=e242]: "Project. Ви збираєте невеликий, але цілісний результат: репозиторій, тестове покриття, інструкції запуску, елементарний деплой. Саме ці елементи цінні на співбесіді."
      - heading "Кому це підійде" [level=2] [ref=e243]
      - list [ref=e244]:
        - listitem [level=1] [ref=e245]: Світчерам із не-ІТ і суміжних ролей — щоб опанувати сферу без зубріння теорії;
        - listitem [level=1] [ref=e246]: "Джуніор-інженерам, яким бракує інструментарію: Git, тести, фреймворки, деплой;"
        - listitem [level=1] [ref=e247]: QA/DevOps/BA, які хочуть підтягнути код і навчитися використовувати інструменти у робочих задачах.
      - paragraph [ref=e248]: "Основна ціль — не просто «знати мову», а працювати як розробник: збирати сервіс, підключати БД, писати тести й віддавати артефакти, яким довіряє команда."
      - heading "Що саме ви робите на старті" [level=2] [ref=e249]
      - paragraph [ref=e250]:
        - text: На конкретному прикладі
        - link "Python Start" [ref=e251] [cursor=pointer]:
          - /url: https://foxminded.ua/python-start-1/
        - text: ": короткі уроки, практика після кожного кроку, підтримка в чаті, безстроковий доступ і типовий темп 3–4 тижні (за годину на день). Мета — швидко поставити базу і підготуватися до менторингу. Аналогічний підхід і в інших напрямах: ви вмикаєте інструменти (наприклад, Git/GitLab), пишете юніт-тести, піднімаєте БД і вчитеся «заводити» сервіс, а не просто читати про нього."
      - heading "Менторинг 1-на-1 — як це працює" [level=2] [ref=e252]
      - paragraph [ref=e253]: "Ви ставите питання, отримуєте завдання, здаєте код, та отримуєте детальний фідбек: що поліпшити, де додати тести, як переробити структуру тощо. У стандартному пакеті включено щоденне code review, у розширеному (Mentoring+) доступні підсилення на вибір: більше рев’ю на день, кастомізація програми або фіксований час зв’язку."
      - heading "Як почати навчання" [level=2] [ref=e254]
      - paragraph [ref=e255]:
        - text: "Спочатку оберіть мову, з якою плануєте працювати у подальшому: Python (автоматизація, веб),"
        - link "JavaScript" [ref=e256] [cursor=pointer]:
          - /url: https://foxminded.ua/javascript-start/
        - text: /Node.js (веб, боти),
        - link "Java" [ref=e257] [cursor=pointer]:
          - /url: https://foxminded.ua/kurs-java-start/
        - text: (бекенд-сервіси),
        - link "QA Automation" [ref=e258] [cursor=pointer]:
